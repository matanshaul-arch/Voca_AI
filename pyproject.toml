[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voca-ai-tse"
version = "0.1.0"
description = "Streaming-ready target speaker extraction MVP"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ecapa = ["speechbrain>=1.1.1"]
data = ["soundfile>=0.12", "scipy>=1.10"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "soundfile>=0.12", "scipy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["voca_tse*"]
